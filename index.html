<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Flying Ship - Hiro Marker</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- AR.js for A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/three.js/build/ar-threex.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #ui {
      position: fixed;
      z-index: 9999;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    #status {
      color: white;
      background: rgba(0,0,0,.65);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
    }

    #wingButton {
      pointer-events: auto;
      border: 0;
      border-radius: 14px;
      padding: 13px 22px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #1976d2;
      box-shadow: 0 5px 18px rgba(0,0,0,.35);
      cursor: pointer;
    }

    #wingButton:active {
      transform: scale(.96);
    }
  </style>
</head>

<body>

  <div id="ui">
    <div id="status">กำลังรอ Hiro Marker...</div>
    <button id="wingButton">กางปีกเรือ</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    device-orientation-permission-ui="enabled: true">

    <a-entity light="type: ambient; color: #ffffff; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 1.5" position="2 4 3"></a-entity>

    <!-- Hiro Marker -->
    <a-marker
      id="hiroMarker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5">

      <!--
        Ship root:
        ใช้เป็นศูนย์กลางของเรือ และหมุนรอบ marker
      -->
      <a-entity id="ship" position="0 0.5 0" rotation="0 0 0">

        <!-- ตัวเรือ -->
        <a-entity id="hull" position="0 0 0">
          <a-box
            position="0 0 0"
            width="1.7"
            height=".28"
            depth=".65"
            color="#1565c0"
            radius=".08">
          </a-box>

          <!-- หัวเรือ -->
          <a-cone
            position="1.02 0 0"
            rotation="0 0 -90"
            radius-bottom=".33"
            radius-top="0"
            height=".65"
            color="#0d47a1">
          </a-cone>

          <!-- ดาดฟ้า -->
          <a-box
            position="0 .2 0"
            width="1.2"
            height=".16"
            depth=".48"
            color="#90caf9">
          </a-box>

          <!-- ห้องนักบิน -->
          <a-box
            position="-.25 .43 0"
            width=".55"
            height=".35"
            depth=".42"
            color="#eeeeee">
          </a-box>

          <!-- กระจก -->
          <a-box
            position=".04 .48 0"
            width=".03"
            height=".18"
            depth=".44"
            color="#29b6f6">
          </a-box>

          <!-- เสา -->
          <a-cylinder
            position="-.48 .72 0"
            radius=".025"
            height=".55"
            color="#424242">
          </a-cylinder>

          <!-- ธง -->
          <a-plane
            position="-.48 .91 .001"
            width=".25"
            height=".14"
            rotation="0 0 0"
            color="#e53935">
          </a-plane>
        </a-entity>

        <!-- ปีกซ้าย/ขวา -->
        <a-entity id="leftWing" position="-.05 .05 -.48" rotation="0 0 0">
          <a-box
            position="-.35 0 0"
            width=".7"
            height=".07"
            depth=".35"
            color="#ffca28">
          </a-box>
          <a-box
            position="-.72 0 0"
            width=".15"
            height=".08"
            depth=".25"
            color="#ff8f00">
          </a-box>
        </a-entity>

        <a-entity id="rightWing" position="-.05 .05 .48" rotation="0 0 0">
          <a-box
            position="-.35 0 0"
            width=".7"
            height=".07"
            depth=".35"
            color="#ffca28">
          </a-box>
          <a-box
            position="-.72 0 0"
            width=".15"
            height=".08"
            depth=".25"
            color="#ff8f00">
          </a-box>
        </a-entity>

        <!-- เครื่องยนต์ด้านหลัง -->
        <a-cylinder
          position="-.95 .05 0"
          rotation="0 0 90"
          radius=".12"
          height=".45"
          color="#263238">
        </a-cylinder>

        <!-- เอฟเฟกต์ไอพ่น -->
        <a-cone
          id="engineGlow"
          position="-1.22 .05 0"
          rotation="0 0 90"
          radius-bottom=".12"
          radius-top=".025"
          height=".35"
          color="#00e5ff"
          opacity=".8">
        </a-cone>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.getElementById('hiroMarker');
    const ship = document.getElementById('ship');
    const leftWing = document.getElementById('leftWing');
    const rightWing = document.getElementById('rightWing');
    const button = document.getElementById('wingButton');
    const status = document.getElementById('status');

    let markerVisible = false;
    let wingsOpen = false;
    let animationFrame = null;

    // ตำแหน่งปีกตอนพับ
    const LEFT_CLOSED = { x: -0.05, y: 0.05, z: -0.48, r: 0 };
    const RIGHT_CLOSED = { x: -0.05, y: 0.05, z: 0.48, r: 0 };

    // ตำแหน่งปีกตอนกาง
    const LEFT_OPEN = { x: -0.05, y: 0.05, z: -0.95, r: -8 };
    const RIGHT_OPEN = { x: -0.05, y: 0.05, z: 0.95, r: 8 };

    function setWing(el, p) {
      el.setAttribute('position', `${p.x} ${p.y} ${p.z}`);
      el.setAttribute('rotation', `0 0 ${p.r}`);
    }

    function animateWing(el, from, to, duration = 650) {
      const start = performance.now();

      function step(now) {
        const t = Math.min((now - start) / duration, 1);
        // smoothstep
        const e = t * t * (3 - 2 * t);

        const p = {
          x: from.x + (to.x - from.x) * e,
          y: from.y + (to.y - from.y) * e,
          z: from.z + (to.z - from.z) * e,
          r: from.r + (to.r - from.r) * e
        };

        setWing(el, p);

        if (t < 1) requestAnimationFrame(step);
      }

      requestAnimationFrame(step);
    }

    function toggleWings() {
      const leftFrom = wingsOpen ? LEFT_OPEN : LEFT_CLOSED;
      const rightFrom = wingsOpen ? RIGHT_OPEN : RIGHT_CLOSED;
      const leftTo = wingsOpen ? LEFT_CLOSED : LEFT_OPEN;
      const rightTo = wingsOpen ? RIGHT_CLOSED : RIGHT_OPEN;

      animateWing(leftWing, leftFrom, leftTo);
      animateWing(rightWing, rightFrom, rightTo);

      wingsOpen = !wingsOpen;
      button.textContent = wingsOpen ? 'พับปีกเรือ' : 'กางปีกเรือ';
    }

    button.addEventListener('click', toggleWings);

    // เมื่อพบ marker
    marker.addEventListener('markerFound', () => {
      markerVisible = true;
      status.textContent = 'พบ Hiro Marker — เรือพร้อมบิน!';
      status.style.background = 'rgba(0,120,70,.8)';
    });

    // เมื่อ marker หาย
    marker.addEventListener('markerLost', () => {
      markerVisible = false;
      status.textContent = 'กำลังค้นหา Hiro Marker...';
      status.style.background = 'rgba(0,0,0,.65)';
    });

    // เรือบินวนเป็นวงกลม
    let angle = 0;

    function flyLoop(time) {
      // ความเร็วในการบิน
      angle += 0.012;

      if (markerVisible) {
        // วงโคจรรอบ marker
        const radius = 1.35;
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;

        // ขึ้นลงเล็กน้อย ให้ดูเหมือนกำลังบิน
        const y = 0.75 + Math.sin(angle * 2) * 0.12;

        // หมุนเรือให้หันไปตามทิศทางการบิน
        const yaw = -angle * 180 / Math.PI + 90;

        ship.setAttribute('position', `${x} ${y} ${z}`);
        ship.setAttribute('rotation', `0 ${yaw} 0`);
      }

      requestAnimationFrame(flyLoop);
    }

    requestAnimationFrame(flyLoop);

    // ป้องกันปุ่มถูกบังโดย scene
    document.getElementById('ui').addEventListener('touchstart', e => {
      e.stopPropagation();
    });
  </script>

</body>
</html>
